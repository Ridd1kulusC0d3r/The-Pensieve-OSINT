name: Deploy Pensieve Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "knowledge/**"
      - "scripts/build_catalog.py"
      - "llms.txt"
      - "llms-full.txt"
      - "ai-index.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate knowledge
        run: python scripts/validate_knowledge.py
      - name: Build static knowledge artifacts
        run: python scripts/build_catalog.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
